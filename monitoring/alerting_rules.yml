groups:
  - name: mestremenu
    rules:
      - alert: CircuitBreakerOpen
        expr: resilience4j_circuitbreaker_state{state="open"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Circuit breaker aberto em {{ $labels.name }}"
          description: "O circuit breaker {{ $labels.name }} está aberto há mais de 1 minuto."

      - alert: HighPaymentFailureRate
        expr: >
          rate(http_server_requests_seconds_count{uri=~".*pagamentos.*",outcome="SERVER_ERROR"}[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Alta taxa de falha em pagamentos"
          description: "Taxa de erros 5xx em pagamentos acima de 10% nos últimos 5 minutos."

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Serviço fora do ar: {{ $labels.job }}"
          description: "O serviço {{ $labels.job }} não está respondendo ao Prometheus."

      - alert: HighJvmHeapUsage
        expr: >
          jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Heap JVM alta em {{ $labels.job }}"
          description: "Uso de heap acima de 85% por mais de 5 minutos em {{ $labels.job }}."
