spring.application.name=pedido-service
server.port=8083

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/mestremenu
spring.datasource.username=mestremenu
spring.datasource.password=mestremenu

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Security
api.security.token.secret=${JWT_SECRET:my-secret-key}

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=pedido-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Outbox relay
outbox.relay.delay-ms=5000

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always

# Jackson
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.time-zone=America/Sao_Paulo
