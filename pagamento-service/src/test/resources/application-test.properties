spring.datasource.url=jdbc:h2:mem:pagamento_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
api.security.token.secret=test-secret-key-for-testing-purposes-only
spring.kafka.bootstrap-servers=localhost:9999
spring.kafka.listener.auto-startup=false
outbox.relay.delay-ms=99999999
pagamento.reprocessar.delay-ms=99999999
pagamento.max-tentativas=2
pagamento.externo.url=http://localhost:9999
