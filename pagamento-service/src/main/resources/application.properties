spring.application.name=pagamento-service
server.port=8084

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/mestremenu
spring.datasource.username=mestremenu
spring.datasource.password=mestremenu

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Flyway — separate history table to avoid conflicts with other services on the same DB
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_pagamento

# Security
api.security.token.secret=${JWT_SECRET:my-secret-key}

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=pagamento-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# External payment processor
pagamento.externo.url=${PAGAMENTO_EXTERNO_URL:http://localhost:8080}

# Outbox relay
outbox.relay.delay-ms=5000

# Pending payment reprocessing
pagamento.reprocessar.delay-ms=30000

# Resilience4j — Circuit Breaker
resilience4j.circuitbreaker.instances.procpag.sliding-window-size=5
resilience4j.circuitbreaker.instances.procpag.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.procpag.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.procpag.permitted-number-of-calls-in-half-open-state=2

# Resilience4j — Retry
resilience4j.retry.instances.procpag.max-attempts=3
resilience4j.retry.instances.procpag.wait-duration=2s

# Resilience4j — Time Limiter
resilience4j.timelimiter.instances.procpag.timeout-duration=5s
resilience4j.timelimiter.instances.procpag.cancel-running-future=true

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always

# Jackson
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=America/Sao_Paulo
