name: mestremenu-microservices

services:
  db:
    image: postgres:16-alpine
    container_name: mestremenu-ms-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mestremenu-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      TZ: America/Sao_Paulo
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - mestremenu-network

  db-pedido:
    image: postgres:16-alpine
    container_name: mestremenu-db-pedido
    environment:
      POSTGRES_DB: ${PEDIDO_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - pgdata_pedido:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mestremenu-network

  db-pagamento:
    image: postgres:16-alpine
    container_name: mestremenu-db-pagamento
    environment:
      POSTGRES_DB: ${PAGAMENTO_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    ports:
      - "5434:5432"
    volumes:
      - pgdata_pagamento:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mestremenu-network

  procpag:
    image: docker.io/erickemprobr/procpag:latest
    container_name: procpag
    ports:
      - "8089:8089"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/openapi.yml > /dev/null 2>&1 || curl -sf http://localhost:8089/openapi.yml > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mestremenu-network

  usuario-service:
    build:
      context: .
      args:
        MODULE_NAME: usuario-service
    container_name: usuario-service
    ports:
      - "5005:5005" # Porta de Debug Isolada
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update #validate
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      JAVA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005 -Duser.timezone=America/Sao_Paulo"
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' "]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - mestremenu-network

  restaurante-service:
    build:
      context: .
      args:
        MODULE_NAME: restaurante-service
    container_name: restaurante-service
    ports:
      - "5006:5005"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update #validate
      USUARIO_SERVICE_URL: http://usuario-service:8080
      JWT_SECRET: ${JWT_SECRET:-my-secret-key}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      JAVA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005 -Duser.timezone=America/Sao_Paulo"
      TZ: America/Sao_Paulo
    depends_on:
      usuario-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' "]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - mestremenu-network

  pedido-service:
    build:
      context: .
      args:
        MODULE_NAME: pedido-service
    container_name: pedido-service
    ports:
      - "5007:5005"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-pedido:5432/${PEDIDO_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      JAVA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005 -Duser.timezone=America/Sao_Paulo"
      TZ: America/Sao_Paulo
    depends_on:
      db-pedido:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - mestremenu-network

  pagamento-service:
    build:
      context: .
      args:
        MODULE_NAME: pagamento-service
    container_name: pagamento-service
    ports:
      - "5008:5005"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-pagamento:5432/${PAGAMENTO_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PAGAMENTO_EXTERNO_URL: http://procpag:8089
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      JAVA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005 -Duser.timezone=America/Sao_Paulo"
      TZ: America/Sao_Paulo
    depends_on:
      db-pagamento:
        condition: service_healthy
      kafka:
        condition: service_healthy
      procpag:
        condition: service_healthy
    networks:
      - mestremenu-network

  gateway-service:
    build:
      context: .
      args:
        MODULE_NAME: gateway-service
    container_name: gateway-service
    ports:
      - "8090:8080"
      - "5009:5005"
    environment:
      USUARIO_SERVICE_URL: http://usuario-service:8080
      RESTAURANTE_SERVICE_URL: http://restaurante-service:8080
      PEDIDO_SERVICE_URL: http://pedido-service:8080
      JWT_SECRET: ${JWT_SECRET:-my-secret-key}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      JAVA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005 -Duser.timezone=America/Sao_Paulo"
      TZ: America/Sao_Paulo
    depends_on:
      usuario-service:
        condition: service_healthy
      restaurante-service:
        condition: service_healthy
      pedido-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' "]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - mestremenu-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerting_rules.yml:/etc/prometheus/alerting_rules.yml:ro
    depends_on:
      usuario-service:
        condition: service_healthy
      restaurante-service:
        condition: service_healthy
      pedido-service:
        condition: service_started
      pagamento-service:
        condition: service_started
      gateway-service:
        condition: service_started
    networks:
      - mestremenu-network

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      TZ: America/Sao_Paulo
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - mestremenu-network

volumes:
  pgdata:
    driver: local
  pgdata_pedido:
    driver: local
  pgdata_pagamento:
    driver: local
  grafana_data:
    driver: local

networks:
  mestremenu-network:
    driver: bridge